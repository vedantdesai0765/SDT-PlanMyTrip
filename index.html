<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanMyTrip</title>
  <meta name="theme-color" content="#f6f7f5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3L3 11.5Z"/><path d="m10.3 13.7 4.8-4.8"/></svg></span>
        <div><b>PlanMyTrip</b><small>Plan · Book · Go</small></div>
      </div>

      <nav id="nav">
        <button data-action="nav" data-view="dashboard" class="active"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-6h6v6"/></svg></span> Dashboard</button>
        <button data-action="nav" data-view="plan"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg></span> Plan a Trip</button>
        <button data-action="nav" data-view="search"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span> Search &amp; Book</button>
        <button data-action="nav" data-view="trips"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/></svg></span> My Trips</button>
        <button data-action="nav" data-view="itinerary"><span aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span> Itinerary</button>
        <button data-action="nav" data-view="alerts"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></svg></span> Alerts <em id="badge" class="nav-badge" hidden>0</em></button>
      </nav>

      <div class="side-foot">
        <button class="btn ghost small" data-action="toggle-theme" aria-label="Switch color theme">◐ <span id="themeLabel">Dark mode</span></button>
        <button class="btn ghost small" data-action="demo">Load demo trip</button>
        <button class="btn ghost small" data-action="reset">Reset all data</button>
        <p>Prototype · data stays in your browser</p>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <label class="global-search"><span aria-hidden="true">⌕</span><input id="globalSearch" type="search" placeholder="Search destinations or activities" aria-label="Search destinations or activities"><kbd>↵</kbd></label>
        <button class="theme-quick" data-action="toggle-theme" aria-label="Toggle dark mode">◐</button>
        <button class="profile-chip" data-action="profile" aria-label="Open profile"><span class="avatar">V</span><span>Guest traveller</span><span aria-hidden="true">⌄</span></button>
      </header>
      <section id="view-dashboard" class="view active"></section>
      <section id="view-plan" class="view"></section>
      <section id="view-search" class="view"></section>
      <section id="view-trips" class="view"></section>
      <section id="view-itinerary" class="view"></section>
      <section id="view-alerts" class="view"></section>
      <footer class="app-footer"><span>© 2026 PlanMyTrip</span><div><a href="#about" data-action="info" data-info="A calm space to plan your next journey. This browser-only prototype stores your trips on this device.">About</a><a href="#help" data-action="info" data-info="Use Plan a Trip to create a trip, Search & Book to add demo bookings, and My Trips to track each plan.">Help</a><a href="#privacy" data-action="info" data-info="Your trip data stays in local browser storage. No account or server is connected.">Privacy</a></div><span>Prototype for Experiment 8</span></footer>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Primary navigation">
    <button data-action="nav" data-view="dashboard" class="active" aria-label="Dashboard"><span><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-6h6v6"/></svg></span><small>Home</small></button>
    <button data-action="nav" data-view="search" aria-label="Search and book"><span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><small>Explore</small></button>
    <button data-action="nav" data-view="plan" aria-label="Plan a trip"><span><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg></span><small>Plan</small></button>
    <button data-action="nav" data-view="trips" aria-label="My trips"><span><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/></svg></span><small>Trips</small></button>
    <button data-action="nav" data-view="alerts" aria-label="Alerts"><span><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></svg></span><small>Alerts</small></button>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
